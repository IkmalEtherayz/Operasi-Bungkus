<!DOCTYPE html>

<html lang="ms">

<head>

  

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Operasi-Bungkus</title>

<style>

* {

  box-sizing: border-box;

  -webkit-tap-highlight-color: transparent;

}

body {

  margin: 0;

  font-family: Arial, sans-serif;

  background: linear-gradient(#87ceeb, #dff7ff);

  overflow: hidden;

  touch-action: manipulation;

}

#game {

  width: 100vw;

  height: 100vh;

  position: relative;

  overflow: hidden;

}

#hud {

  position: absolute;

  top: 10px;

  left: 10px;

  right: 10px;

  z-index: 20;

  display: flex;

  justify-content: space-between;

  gap: 6px;

  flex-wrap: wrap;

}

.hudBox {

  background: rgba(0,0,0,.72);

  color: white;

  padding: 8px 12px;

  border-radius: 12px;

  font-weight: bold;

  font-size: 14px;

}

#road {

  position: absolute;

  bottom: 0;

  left: 0;

  width: 100%;

  height: 72%;

  background:

    repeating-linear-gradient(

      90deg,

      #444 0px,

      #444 47px,

      #555 48px,

      #555 95px

    );

  border-top: 7px solid #777;

}

#road::after {

  content: "";

  position: absolute;

  left: 50%;

  top: 0;

  width: 8px;

  height: 100%;

  transform: translateX(-50%);

  background: repeating-linear-gradient(

    to bottom,

    #fff 0px,

    #fff 45px,

    transparent 45px,

    transparent 90px

  );

  opacity: .8;

}

#player {

  position: absolute;

  z-index: 10;

  bottom: 12%;

  left: 50%;

  transform: translateX(-50%);

  width: 70px;

  height: 85px;

  text-align: center;

  transition: left .08s linear;

}

#playerFace {

  width: 58px;

  height: 58px;

  margin: auto;

  border-radius: 50%;

  background: #ffcc99;

  border: 4px solid white;

  box-shadow: 0 3px 8px #222;

  overflow: hidden;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 40px;

}

#motor {

  font-size: 35px;

  line-height: 30px;

}

.obstacle {

  position: absolute;

  z-index: 8;

  font-size: 42px;

  width: 60px;

  height: 60px;

  text-align: center;

}

.package {

  position: absolute;

  z-index: 7;

  font-size: 38px;

  width: 55px;

  height: 55px;

  text-align: center;

}

#controls {

  position: absolute;

  bottom: 20px;

  left: 0;

  right: 0;

  z-index: 30;

  display: flex;

  justify-content: center;

  gap: 20px;

}

.controlBtn {

  width: 85px;

  height: 65px;

  border: none;

  border-radius: 18px;

  background: rgba(0,0,0,.75);

  color: white;

  font-size: 30px;

  font-weight: bold;

}

.controlBtn:active {

  transform: scale(.92);

}

#menu,

#gameOver,

#levelUp,

#bossScreen {

  position: absolute;

  inset: 0;

  z-index: 100;

  background: rgba(0,0,0,.82);

  color: white;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  text-align: center;

  padding: 20px;

}

#gameOver,

#levelUp,

#bossScreen {

  display: none;

}

.title {

  font-size: 42px;

  font-weight: 900;

  margin-bottom: 8px;

  color: #ffd700;

  text-shadow: 3px 3px #222;

}

.subtitle {

  font-size: 18px;

  margin-bottom: 20px;

}

.mainBtn {

  border: none;

  background: #ffcc00;

  color: #111;

  padding: 15px 28px;

  border-radius: 15px;

  font-size: 20px;

  font-weight: bold;

  margin: 7px;

}

.mainBtn:active {

  transform: scale(.95);

}

#upload {

  display: none;

}

.uploadBtn {

  display: inline-block;

  background: #2196f3;

  padding: 13px 20px;

  border-radius: 14px;

  font-weight: bold;

  margin: 8px;

}

#boss {

  position: absolute;

  z-index: 50;

  width: 120px;

  height: 120px;

  display: none;

  font-size: 90px;

  text-align: center;

  filter: drop-shadow(0 5px 5px #111);

}

#bossHP {

  position: absolute;

  z-index: 51;

  display: none;

  top: 90px;

  left: 50%;

  transform: translateX(-50%);

  background: #111;

  border: 3px solid white;

  border-radius: 12px;

  padding: 5px 12px;

  color: #ff4444;

  font-weight: bold;

}

#shield {

  position: absolute;

  z-index: 11;

  bottom: 10%;

  left: 50%;

  transform: translateX(-50%);

  width: 95px;

  height: 95px;

  border: 5px solid #00eaff;

  border-radius: 50%;

  display: none;

  opacity: .7;

  box-shadow: 0 0 25px #00eaff;

}

#message {

  position: absolute;

  z-index: 60;

  top: 42%;

  left: 50%;

  transform: translate(-50%, -50%);

  color: white;

  font-size: 28px;

  font-weight: bold;

  text-align: center;

  text-shadow: 3px 3px #000;

  pointer-events: none;

}

.hidden {

  display: none !important;

}

</style>

</head>

<body>

<div id="game">

  <div id="hud">

    <div class="hudBox">🎮 LEVEL <span id="level">1</span></div>

    <div class="hudBox">⭐ SCORE <span id="score">0</span></div>

    <div class="hudBox">⚡ SPEED <span id="speed">1</span></div>

    <div class="hudBox">🛡️ SHIELD <span id="shieldCount">3</span></div>

  </div>

  <div id="road"></div>

  <div id="player">

    <div id="playerFace">🙂</div>

    <div id="motor">🏍️</div>

  </div>

  <div id="shield"></div>

  <div id="boss">🐉</div>

  <div id="bossHP">❤️❤️❤️</div>

  <div id="message"></div>

  <div id="controls">

    <button class="controlBtn" id="leftBtn">⬅️</button>

    <button class="controlBtn" id="rightBtn">➡️</button>

  </div>

  <div id="menu">

    <div class="title">📦 OPERASI-BUNGKUS</div>

    <div class="subtitle">

      Misi penghantaran bermula!<br>

      Elakkan halangan dan kumpulkan bungkusan.

    </div>

    <label class="uploadBtn">

      📸 Masukkan Kepala Sendiri

      <input id="upload" type="file" accept="image/*">

    </label>

    <button class="mainBtn" id="startBtn">🚀 MULA GAME</button>

  </div>

  <div id="levelUp">

    <div class="title">🎉 LEVEL UP!</div>

    <div class="subtitle" id="levelText"></div>

    <button class="mainBtn" id="continueBtn">▶️ TERUSKAN</button>

  </div>

  <div id="bossScreen">

    <div class="title">🐉 FINAL BOSS!</div>

    <div class="subtitle">

      Naga besar muncul!<br>

      Tekan naga sebanyak 3 kali untuk mengalahkannya!

    </div>

    <button class="mainBtn" id="fightBtn">⚔️ LAWAN NAGA</button>

  </div>

  <div id="gameOver">

    <div class="title">💥 GAME OVER</div>

    <div class="subtitle">

      Score: <span id="finalScore">0</span><br>

      Level: <span id="finalLevel">1</span>

    </div>

    <button class="mainBtn" id="restartBtn">🔄 MAIN SEMULA</button>

  </div>

</div>

<script>

let gameRunning = false;

let level = 1;

let score = 0;

let speed = 1;

let shieldCount = 3;

let playerX = 50;

let objects = [];

let spawnTimer;

let animationFrame;

let bossActive = false;

let bossHP = 3;

let bossX = 50;

let bossY = 20;

let bossDirection = 1;

const game = document.getElementById("game");

const player = document.getElementById("player");

const playerFace = document.getElementById("playerFace");

const levelDisplay = document.getElementById("level");

const scoreDisplay = document.getElementById("score");

const speedDisplay = document.getElementById("speed");

const shieldDisplay = document.getElementById("shieldCount");

const menu = document.getElementById("menu");

const gameOver = document.getElementById("gameOver");

const levelUp = document.getElementById("levelUp");

const bossScreen = document.getElementById("bossScreen");

const boss = document.getElementById("boss");

const bossHPDisplay = document.getElementById("bossHP");

const shield = document.getElementById("shield");

function updateHUD() {

  levelDisplay.textContent = level;

  scoreDisplay.textContent = score;

  speedDisplay.textContent = speed.toFixed(1);

  shieldDisplay.textContent = shieldCount;

}

function movePlayer(direction) {

  if (!gameRunning || bossActive) return;

  playerX += direction * 7;

  if (playerX < 12) playerX = 12;

  if (playerX > 88) playerX = 88;

  player.style.left = playerX + "%";

  shield.style.left = playerX + "%";

}

document.getElementById("leftBtn").addEventListener("touchstart", e => {

  e.preventDefault();

  movePlayer(-1);

});

document.getElementById("rightBtn").addEventListener("touchstart", e => {

  e.preventDefault();

  movePlayer(1);

});

document.getElementById("leftBtn").addEventListener("click", () => movePlayer(-1));

document.getElementById("rightBtn").addEventListener("click", () => movePlayer(1));

document.addEventListener("keydown", e => {

  if (e.key === "ArrowLeft") movePlayer(-1);

  if (e.key === "ArrowRight") movePlayer(1);

});

document.getElementById("upload").addEventListener("change", function(e) {

  const file = e.target.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(event) {

    playerFace.innerHTML =

      `<img src="${event.target.result}"

      style="width:100%;height:100%;object-fit:cover;">`;

  };

  reader.readAsDataURL(file);

});

document.getElementById("startBtn").onclick = startGame;

function startGame() {

  menu.style.display = "none";

  gameOver.style.display = "none";

  levelUp.style.display = "none";

  level = 1;

  score = 0;

  speed = 1;

  shieldCount = 3;

  playerX = 50;

  player.style.left = "50%";

  shield.style.left = "50%";

  objects.forEach(o => o.element.remove());

  objects = [];

  bossActive = false;

  updateHUD();

  gameRunning = true;

  startSpawning();

  gameLoop();

}

function startSpawning() {

  clearInterval(spawnTimer);

  spawnTimer = setInterval(() => {

    if (!gameRunning || bossActive) return;

    spawnObject();

  }, Math.max(450, 1000 - level * 100));

}

function spawnObject() {

  const isPackage = Math.random() < 0.38;

  const element = document.createElement("div");

  element.className = isPackage ? "package" : "obstacle";

  element.textContent = isPackage

    ? ["📦","🎁","🛍️"][Math.floor(Math.random()*3)]

    : ["🚧","🪨","🚗","🛵"][Math.floor(Math.random()*4)];

  const x = 10 + Math.random() * 80;

  element.style.left = x + "%";

  element.style.top = "-70px";

  game.appendChild(element);

  objects.push({

    element: element,

    x: x,

    y: -70,

    type: isPackage ? "package" : "obstacle"

  });

}

function gameLoop() {

  if (!gameRunning) return;

  objects.forEach((obj, index) => {

    obj.y += 3 + speed * 1.5;

    obj.element.style.top = obj.y + "px";

    const playerRect = player.getBoundingClientRect();

    const objectRect = obj.element.getBoundingClientRect();

    if (

      objectRect.bottom > playerRect.top + 15 &&

      objectRect.top < playerRect.bottom &&

      objectRect.right > playerRect.left &&

      objectRect.left < playerRect.right

    ) {

      if (obj.type === "package") {

        score += 10;

        showMessage("📦 +10");

        removeObject(index);

        if (score % 100 === 0) {

          levelUpCheck();

        }

      } else {

        if (shieldCount > 0) {

          shieldCount--;

          shield.style.display = "block";

          setTimeout(() => {

            shield.style.display = "none";

          }, 500);

          showMessage("🛡️ SHIELD!");

          removeObject(index);

          updateHUD();

        } else {

          endGame();

        }

      }

    }

    if (obj.y > window.innerHeight + 100) {

      removeObject(index);

    }

  });

  animationFrame = requestAnimationFrame(gameLoop);

}

function removeObject(index) {

  if (!objects[index]) return;

  objects[index].element.remove();

  objects.splice(index, 1);

}

function showMessage(text) {

  const message = document.getElementById("message");

  message.textContent = text;

  setTimeout(() => {

    message.textContent = "";

  }, 600);

}

function levelUpCheck() {

  if (level >= 5) {

    startBoss();

    return;

  }

  level++;

  speed += 0.7;

  updateHUD();

  gameRunning = false;

  clearInterval(spawnTimer);

  document.getElementById("levelText").textContent =

    "Tahniah! Anda telah sampai Level " + level +

    ". Kelajuan semakin pantas!";

  levelUp.style.display = "flex";

}

document.getElementById("continueBtn").onclick = function() {

  levelUp.style.display = "none";

  gameRunning = true;

  startSpawning();

  gameLoop();

};

function startBoss() {

  gameRunning = false;

  clearInterval(spawnTimer);

  objects.forEach(o => o.element.remove());

  objects = [];

  bossScreen.style.display = "flex";

}

document.getElementById("fightBtn").onclick = function() {

  bossScreen.style.display = "none";

  bossActive = true;

  bossHP = 3;

  boss.style.display = "block";

  bossHPDisplay.style.display = "block";

  updateBossHP();

  bossX = 50;

  bossY = 18;

  bossDirection = 1;

  boss.style.left = bossX + "%";

  boss.style.top = bossY + "%";

  gameRunning = true;

  bossLoop();

};

function updateBossHP() {

  bossHPDisplay.textContent =

    "❤️".repeat(bossHP);

}

boss.addEventListener("click", hitBoss);

boss.addEventListener("touchstart", function(e) {

  e.preventDefault();

  hitBoss();

});

function hitBoss() {

  if (!bossActive) return;

  bossHP--;

  updateBossHP();

  showMessage("⚔️ HIT!");

  boss.style.transform = "scale(1.3)";

  setTimeout(() => {

    boss.style.transform = "scale(1)";

  }, 120);

  if (bossHP <= 0) {

    bossDefeated();

  }

}

function bossLoop() {

  if (!bossActive) return;

  bossX += bossDirection * 0.7;

  if (bossX > 82) {

    bossDirection = -1;

  }

  if (bossX < 8) {

    bossDirection = 1;

  }

  bossY =

    15 +

    Math.sin(Date.now() / 500) * 7;

  boss.style.left = bossX + "%";

  boss.style.top = bossY + "%";

  animationFrame = requestAnimationFrame(bossLoop);

}

function bossDefeated() {

  bossActive = false;

  gameRunning = false;

  boss.style.display = "none";

  bossHPDisplay.style.display = "none";

  score += 500;

  updateHUD();

  setTimeout(() => {

    alert(

      "🏆 TAHNIAH!\n\n" +

      "Naga telah dikalahkan!\n" +

      "Operasi-Bungkus berjaya!\n\n" +

      "Score: " + score

    );

    location.reload();

  }, 300);

}

function endGame() {

  gameRunning = false;

  clearInterval(spawnTimer);

  cancelAnimationFrame(animationFrame);

  document.getElementById("finalScore").textContent = score;

  document.getElementById("finalLevel").textContent = level;

  gameOver.style.display = "flex";

}

document.getElementById("restartBtn").onclick = function() {

  gameOver.style.display = "none";

  startGame();

};

updateHUD();

</script>

</body>

</html>
