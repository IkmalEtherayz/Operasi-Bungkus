<!DOCTYPE html>

<html lang="ms">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Operasi Bungkus</title>

<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#eef6ff,#d9eaff);color:#17324d;min-height:100vh;overflow:hidden;touch-action:manipulation}

.game{width:100%;max-width:520px;min-height:100vh;margin:auto;padding:18px 16px 22px;display:flex;flex-direction:column}

.header{text-align:center;background:white;border-radius:20px;padding:14px 12px;box-shadow:0 5px 18px rgba(0,0,0,.12)}

.header h1{margin:0;font-size:28px}.header p{margin:5px 0 0;font-size:14px}

.stats{display:flex;justify-content:space-between;gap:8px;margin-top:12px}

.stat{flex:1;background:white;border-radius:14px;padding:9px 5px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.08);font-weight:bold}

.label{display:block;font-size:11px;opacity:.65}.value{display:block;font-size:20px;margin-top:2px}

.game-area{position:relative;flex:1;margin-top:12px;min-height:390px;background:linear-gradient(#ffffffaa,#ffffffaa),repeating-linear-gradient(45deg,#d9c19a 0,#d9c19a 22px,#cdb287 22px,#cdb287 44px);border:5px solid white;border-radius:24px;overflow:hidden;box-shadow:inset 0 0 20px rgba(0,0,0,.12),0 5px 18px rgba(0,0,0,.12)}

.instructions{text-align:center;padding:10px;font-weight:bold;background:rgba(255,255,255,.85);border-radius:14px;margin:10px}

.package,.wrong-item{position:absolute;width:64px;height:64px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:34px;box-shadow:0 5px 10px rgba(0,0,0,.25);z-index:5}

.package{background:#c98a45;border:4px solid #8b5a2b}

.package:after{content:"";position:absolute;width:7px;height:100%;background:#f1d08b;opacity:.9}

.wrong-item{background:#d9534f;border:4px solid #922b27}

.wrong-item.bomb{background:#444;border-color:#111}

.wrong-item.brick{background:#9e9e9e;border-color:#666}

.wrong-item.can{background:#8bc34a;border-color:#558b2f}

.player{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);width:72px;height:72px;border-radius:50%;background:#1976d2;border:5px solid white;display:flex;align-items:center;justify-content:center;font-size:38px;box-shadow:0 5px 12px rgba(0,0,0,.3);z-index:10;background-size:cover;background-position:center;overflow:hidden}

.boss{position:absolute;top:48px;left:50%;transform:translateX(-50%);font-size:72px;z-index:7;display:none;filter:drop-shadow(0 5px 5px rgba(0,0,0,.35))}

.boss.show{display:block}

.boss-bar{position:absolute;top:10px;left:12%;width:76%;height:16px;background:#222;border-radius:10px;overflow:hidden;z-index:8;display:none}

.boss-bar.show{display:block}

.boss-hp{height:100%;width:100%;background:#e53935}

.controls{display:flex;justify-content:space-between;gap:30px;margin-top:14px;padding:0 12px}

.control{flex:1;height:76px;border:none;border-radius:22px;background:white;color:#17324d;font-size:38px;font-weight:bold;box-shadow:0 6px 15px rgba(0,0,0,.18);touch-action:none;user-select:none}

.control:active{transform:scale(.94);background:#e8f2ff}

.message{text-align:center;min-height:28px;margin-top:7px;font-weight:bold;font-size:16px}

.overlay{position:fixed;inset:0;background:rgba(8,25,40,.78);display:none;align-items:center;justify-content:center;padding:22px;z-index:100}

.overlay.show{display:flex}

.panel{width:100%;max-width:400px;background:white;border-radius:25px;padding:28px 22px;text-align:center;box-shadow:0 10px 35px rgba(0,0,0,.35)}

.panel h2{margin-top:0;font-size:30px}

.start-btn,.camera-intro-btn{width:100%;border:none;border-radius:17px;padding:17px;color:white;font-size:20px;font-weight:bold;margin-top:12px}

.start-btn{background:#1976d2}

.start-btn:disabled{background:#aab7c4;opacity:.7}

.camera-intro-btn{background:#222}

.photo-status{margin-top:12px;font-weight:bold;font-size:14px}

.rank{margin-top:18px;background:#f1f6fa;border-radius:15px;padding:12px;text-align:left}

.rank-title{font-weight:bold;text-align:center;margin-bottom:7px}

.rank-row{display:flex;justify-content:space-between;padding:5px 2px}

#cameraOverlay{position:fixed;inset:0;background:#000;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}

#cameraOverlay video{width:100%;max-width:420px;max-height:70vh;object-fit:cover;border-radius:20px;transform:scaleX(-1)}

.camera-action{margin-top:20px;padding:14px 28px;border:0;border-radius:30px;background:white;color:#111;font-size:18px;font-weight:bold}

.camera-close{margin-top:10px;padding:10px 22px;border:0;border-radius:20px;background:#333;color:white;font-size:15px}

@media(max-height:700px){.game-area{min-height:300px}.control{height:65px}}

</style>

</head>
